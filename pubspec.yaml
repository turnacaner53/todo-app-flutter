name: todo_app_flutterv2
description: "Local-first task lists and notes."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cupertino_icons: ^1.0.8
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_colorpicker: ^1.1.0
  flutter_localizations:
    sdk: flutter
  # Riverpod 3 runtime; codegen (riverpod_generator) bu Flutter'ın meta 1.17
  # pin'iyle çözümlenemiyor → provider'lar elle tanımlı (bkz. plan notu).
  flutter_quill: 11.5.0
  flutter_reorderable_grid_view: ^5.7.0
  flutter_riverpod: 3.3.2
  go_router: 17.5.0
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.5
  uuid: ^4.6.0

dev_dependencies:
  # build_runner 2.15.2+ analyzer >=13.3 istiyor; drift_dev 2.34.0 analyzer <13
  # ile çalıştığından aralık kısıtlandı.
  build_runner: '>=2.14.0 <2.15.2'
  drift_dev: 2.34.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0 # 10.3+ needs Dart 3.12

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#5B5BD6"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
